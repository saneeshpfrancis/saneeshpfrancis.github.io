) harmonic power spectrum","Dynamic force & velocity vector overlays with virtual photogate","Real-time data streaming & CSV export for Python, MATLAB, and Excel"],features:["Symplectic vs Non-Symplectic Integrator Drift Analysis","Real-Time Oscilloscope for θ(t), ω(t), α(t), and Energy Drift %","Full 360° Drag & Drop Bob Positioning","Photogate Sensor for Experimental Period Timing","Viscous Air Drag & Quadratic Fluid Damping","Periodic Sinusoidal Driving Torque for Chaos Studies"],tags:["Classical Mechanics","Nonlinear Dynamics","Symplectic Integrators","Phase Space","Separatrix","FFT Analysis","Virtual Labs"],exercises:[{id:1,title:"Large-Angle Anharmonicity & Elliptic Period Validation",objective:"Measure the deviation of the pendulum's period from the simple harmonic approximation T₀ = 2π√(L/g) as initial amplitude θ₀ increases.",procedure:"Set L = 1.0 m, m = 1.0 kg, g = 9.807 m/s², γ = 0. Test angles θ₀ ∈ {5°, 20°, 45°, 60°, 90°, 120°, 150°}. Record measured photogate period and compare against the AGM elliptic integral and Borda's series expansion."},{id:2,title:"Symplectic vs. Non-Symplectic Integrator Stability",objective:"Understand Liouville's theorem and artificial numerical energy drift across different mathematical integration methods.",procedure:"Release bob with θ₀ = 45°, γ = 0. Switch to Forward Euler and observe rapid positive energy divergence. Reset and switch to Velocity-Verlet or Euler-Cromer to observe tight energy conservation. Benchmark local error vs RK4."},{id:3,title:"Phase Space Topology & The Separatrix",objective:"Map the topological boundary between bounded oscillatory libration and unbounded whirling rotation in (θ, ω) phase space.",procedure:"Select Phase Space tab. Click preset 'Separatrix & Inverted (θ₀ = 179.5°)'. Observe asymptotic slowing near the saddle point. Apply initial angular velocity ω₀ > 2√(g/L) to verify entry into continuous rotation."},{id:4,title:"Harmonic Generation via Fast Fourier Transform (FFT)",objective:"Dem
